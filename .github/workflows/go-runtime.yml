name: Go Runtime CI and Release

on:
  push:
    branches:
      - main
    paths:
      - 'go-runtime/**'
      - 'agent/call-audio-helper/**'
      - 'agent/cellular-io/**'
      - 'providers/vowifi-go/**'
      - 'install.sh'
      - 'offline-install.sh'
      - 'docker-compose.yml'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - '.github/workflows/go-runtime.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'go-runtime/**'
      - 'agent/call-audio-helper/**'
      - 'agent/cellular-io/**'
      - 'providers/vowifi-go/**'
      - 'install.sh'
      - 'offline-install.sh'
      - 'docker-compose.yml'
      - 'README.md'
      - 'DEPLOYMENT.md'
      - '.github/workflows/go-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: '1'

jobs:
  validate-core:
    name: Validate Core runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: providers/vowifi-go/go.mod
          cache-dependency-path: |
            agent/call-audio-helper/go.sum
            go-runtime/go.sum
            providers/vowifi-go/go.sum

      - name: Install native build dependencies
        run: |
          azure_cli_source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$azure_cli_source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$azure_cli_source"; then
            sudo mv "$azure_cli_source" "$azure_cli_source.disabled"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libpcsclite-dev pkg-config xorg-dev

      - name: Verify Core module
        working-directory: go-runtime
        run: go mod verify

      - name: Test Core runtime
        working-directory: go-runtime
        run: go test ./...

      - name: Test exact-modem audio helper
        run: GOWORK=off go -C agent/call-audio-helper test -race ./...

      - name: Race-test changed Core boundaries
        working-directory: go-runtime
        run: >-
          go test -race
          ./internal/egressconfig
          ./internal/egressdesired
          ./internal/agentmedia
          ./internal/runtimereconcile
          ./cmd/mdd-core
          ./internal/core
          ./internal/webui

      - name: Vet Core runtime
        working-directory: go-runtime
        run: go vet ./...

      - name: Check embedded WebUI JavaScript
        run: node --check go-runtime/internal/webui/assets/app.js

  validate-provider:
    name: Validate VoWiFi Provider
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: providers/vowifi-go/go.mod
          cache-dependency-path: |
            go-runtime/go.sum
            providers/vowifi-go/go.sum
            providers/vowifi-go/upstream/vowifi-go/go.sum

      - name: Install AMR codec dependency
        run: |
          azure_cli_source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$azure_cli_source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$azure_cli_source"; then
            sudo mv "$azure_cli_source" "$azure_cli_source.disabled"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopencore-amrnb-dev pkg-config

      - name: Verify Provider module
        working-directory: providers/vowifi-go
        run: go mod verify

      - name: Verify patched upstream module
        run: GOWORK=off go -C providers/vowifi-go/upstream/vowifi-go mod verify

      - name: Test Provider
        working-directory: providers/vowifi-go
        run: go test -v -timeout 2m ./...

      - name: Race-test Provider
        working-directory: providers/vowifi-go
        run: go test -race ./...

      - name: Test patched upstream runtime
        run: >-
          GOWORK=off go -C providers/vowifi-go/upstream/vowifi-go
          test -race -timeout 2m ./runtimehost/...

      - name: Vet patched upstream runtime
        run: GOWORK=off go -C providers/vowifi-go/upstream/vowifi-go vet ./runtimehost/...

      - name: Vet Provider
        working-directory: providers/vowifi-go
        run: go vet ./...

  release-linux-amd64:
    name: Build verified Linux amd64 release
    needs:
      - validate-core
      - validate-provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: providers/vowifi-go/go.mod
          cache-dependency-path: |
            go-runtime/go.sum
            providers/vowifi-go/go.sum

      - name: Install native build dependencies
        run: |
          azure_cli_source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$azure_cli_source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$azure_cli_source"; then
            sudo mv "$azure_cli_source" "$azure_cli_source.disabled"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils libgl1-mesa-dev libopencore-amrnb-dev libpcsclite-dev pcscd pkg-config xorg-dev

      - name: Build release executables
        env:
          BUILD_ROOT: ${{ runner.temp }}/mdd-build
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_ROOT/bin"
          mkdir -p "$BUILD_ROOT/source"
          go -C go-runtime build -trimpath -o "$BUILD_ROOT/bin/mdd-core" ./cmd/mdd-core
          go -C go-runtime build -trimpath -o "$BUILD_ROOT/bin/mdd-agent" ./cmd/mdd-agent
          go -C go-runtime build -trimpath -o "$BUILD_ROOT/bin/mdd-release" ./cmd/mdd-release
          CGO_ENABLED=1 go -C providers/vowifi-go build \
            -tags netgo,osusergo \
            -trimpath \
            -ldflags '-linkmode external -extldflags "-static"' \
            -o "$BUILD_ROOT/bin/mdd-vowifi" \
            ./cmd/mdd-vowifi
          if readelf -d "$BUILD_ROOT/bin/mdd-vowifi" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'mdd-vowifi unexpectedly has dynamic library dependencies' >&2
            readelf -d "$BUILD_ROOT/bin/mdd-vowifi" >&2
            exit 1
          fi

      - name: Verify systemd units
        env:
          BUILD_ROOT: ${{ runner.temp }}/mdd-build
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/libexec/mdd
          sudo install -m 0755 "$BUILD_ROOT/bin/mdd-core" /usr/libexec/mdd/mdd-core
          sudo install -m 0755 "$BUILD_ROOT/bin/mdd-agent" /usr/libexec/mdd/mdd-agent
          sudo install -m 0755 "$BUILD_ROOT/bin/mdd-vowifi" /usr/libexec/mdd/mdd-vowifi
          systemd-analyze verify \
            go-runtime/release/mdd-core.service \
            go-runtime/release/mdd-agent.service \
            go-runtime/release/mdd-egress.service \
            go-runtime/release/mdd-provider-apply.service \
            go-runtime/release/mdd-vowifi@.service
          grep -Fxq \
            'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK' \
            go-runtime/release/mdd-egress.service

      - name: Assemble strict release bundle
        env:
          BUILD_ROOT: ${{ runner.temp }}/mdd-build
          RELEASE_ROOT: ${{ runner.temp }}/mdd-release
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_id="mdd-${SOURCE_REVISION:0:12}"
          release_dir="$RELEASE_ROOT/$release_id"
          mkdir -p "$BUILD_ROOT/source" "$RELEASE_ROOT"
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "$GITHUB_WORKSPACE" \
            -cf - providers/vowifi-go \
            | gzip -n > "$BUILD_ROOT/source/mdd-vowifi-source.tar.gz"
          "$BUILD_ROOT/bin/mdd-release" \
            -output "$release_dir" \
            -release-id "$release_id" \
            -source-revision "$SOURCE_REVISION" \
            -architecture amd64 \
            -core "$BUILD_ROOT/bin/mdd-core" \
            -agent "$BUILD_ROOT/bin/mdd-agent" \
            -provider "$BUILD_ROOT/bin/mdd-vowifi" \
            -core-unit "$GITHUB_WORKSPACE/go-runtime/release/mdd-core.service" \
            -agent-unit "$GITHUB_WORKSPACE/go-runtime/release/mdd-agent.service" \
            -provider-unit "$GITHUB_WORKSPACE/go-runtime/release/mdd-vowifi@.service" \
            -provider-apply-unit "$GITHUB_WORKSPACE/go-runtime/release/mdd-provider-apply.service" \
            -egress-unit "$GITHUB_WORKSPACE/go-runtime/release/mdd-egress.service" \
            -provider-source "$BUILD_ROOT/source/mdd-vowifi-source.tar.gz" \
            -provider-notice "$GITHUB_WORKSPACE/providers/vowifi-go/LICENSE-NOTICE.md"
          install -m 0755 "$GITHUB_WORKSPACE/go-runtime/release/install-release.sh" \
            "$RELEASE_ROOT/install-release.sh"
          tar -C "$RELEASE_ROOT" -cf "$RUNNER_TEMP/$release_id-linux-amd64.tar" \
            install-release.sh "$release_id"
          printf 'artifact_path=%s\n' "$RUNNER_TEMP/$release_id-linux-amd64.tar" >> "$GITHUB_ENV"

      - name: Upload immutable release tar
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.artifact_path }}
          archive: false
          if-no-files-found: error
          # Deployment consumers delete the artifact immediately after a verified
          # download. Keep only the shortest GitHub-supported fallback window.
          retention-days: 1

  validate-fresh-linux-artifact:
    name: Install fresh artifact without source checkout
    needs:
      - release-linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Deliberately no actions/checkout step: this gate must prove that the
      # published artifact, rather than a source tree, is independently usable.
      - name: Download exact Linux release artifact
        uses: actions/download-artifact@v8
        with:
          pattern: mdd-*-linux-amd64.tar
          path: ${{ runner.temp }}/artifact
          merge-multiple: true

      - name: Install PC/SC runtime dependency
        run: |
          set -euo pipefail
          azure_cli_source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$azure_cli_source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$azure_cli_source"; then
            sudo mv "$azure_cli_source" "$azure_cli_source.disabled"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq pcscd

      - name: Extract artifact and install fail-fast legacy shims
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/artifact
          FRESH_ROOT: ${{ runner.temp }}/fresh
          LEGACY_TRACE: ${{ runner.temp }}/legacy-command-trace
          SHIM_ROOT: ${{ runner.temp }}/legacy-command-shims
        run: |
          set -euo pipefail
          for command in realpath curl openssl timeout; do
            command -v "$command" >/dev/null
          done
          test -x /bin/systemctl
          test -x /usr/sbin/useradd
          test -x /usr/sbin/groupadd
          test -x /usr/sbin/nologin
          mkdir -p "$FRESH_ROOT" "$SHIM_ROOT"
          mapfile -t archives < <(find "$ARTIFACT_ROOT" -maxdepth 1 -type f -name '*.tar' -print)
          test "${#archives[@]}" -eq 1
          tar -xf "${archives[0]}" -C "$FRESH_ROOT"
          test -x "$FRESH_ROOT/install-release.sh"
          mapfile -t releases < <(find "$FRESH_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'mdd-*' -print)
          test "${#releases[@]}" -eq 1
          printf 'release_dir=%s\n' "${releases[0]}" >> "$GITHUB_ENV"
          : > "$LEGACY_TRACE"
          for command in docker docker-compose python python3; do
            printf '%s\n' '#!/bin/sh' \
              "printf '%s\\n' '$command' >> '$LEGACY_TRACE'" \
              'exit 97' > "$SHIM_ROOT/$command"
            chmod 0755 "$SHIM_ROOT/$command"
          done
          printf 'shim_root=%s\n' "$SHIM_ROOT" >> "$GITHUB_ENV"
          printf 'legacy_trace=%s\n' "$LEGACY_TRACE" >> "$GITHUB_ENV"

      - name: Install, bootstrap and start only the Go services
        env:
          MDD_CI_PASSWORD: fresh-artifact-ci-password
        run: |
          set -euo pipefail
          assert_orphan_refused() {
            if printf '%s\n' "$MDD_CI_PASSWORD" |
                sudo env "PATH=$shim_root:$PATH" \
                  "$RUNNER_TEMP/fresh/install-release.sh" install "$release_dir"; then
              echo 'fresh install accepted orphaned durable state' >&2
              exit 1
            fi
            test ! -e /usr/lib/mdd/current
            test ! -e /var/lib/mdd-system/release-install/current.json
            test ! -s "$legacy_trace"
          }
          for database in events.db messages.db messages.db.cellular-operations \
              calls.db catalog.db egress.db; do
            sudo install -d -m 0700 /var/lib/mdd
            sudo touch "/var/lib/mdd/$database"
            assert_orphan_refused
            sudo rm -f "/var/lib/mdd/$database"
            sudo rmdir /var/lib/mdd
          done
          sudo install -d -m 0700 /var/lib/mdd/providers
          sudo touch /var/lib/mdd/providers/orphan
          assert_orphan_refused
          sudo rm -f /var/lib/mdd/providers/orphan
          sudo rmdir /var/lib/mdd/providers /var/lib/mdd
          sudo install -d -m 0750 /var/lib/mdd-egress-config
          sudo touch /var/lib/mdd-egress-config/desired.json
          assert_orphan_refused
          sudo rm -f /var/lib/mdd-egress-config/desired.json
          sudo rmdir /var/lib/mdd-egress-config
          sudo install -d -m 0755 /etc/mdd
          sudo touch /etc/mdd/providers-current
          assert_orphan_refused
          sudo rm -f /etc/mdd/providers-current
          sudo rmdir /etc/mdd
          sudo install -d -m 0755 /etc/mdd/providers/releases
          sudo touch /etc/mdd/providers/releases/orphan
          assert_orphan_refused
          sudo rm -f /etc/mdd/providers/releases/orphan
          sudo rmdir /etc/mdd/providers/releases /etc/mdd/providers /etc/mdd

          printf '%s\n' "$MDD_CI_PASSWORD" |
            sudo env "PATH=$shim_root:$PATH" \
              "$RUNNER_TEMP/fresh/install-release.sh" install "$release_dir"
          test ! -s "$legacy_trace"
          release_id=$(basename "$release_dir")
          test "$(readlink -f /usr/lib/mdd/current)" = "/usr/lib/mdd/releases/$release_id"
          test "$(readlink -f /usr/libexec/mdd/mdd-agent)" = "/usr/lib/mdd/releases/$release_id/mdd-agent"
          test "$(readlink -f /etc/systemd/system/mdd-agent.service)" = "/usr/lib/mdd/releases/$release_id/mdd-agent.service"
          test "$(systemctl is-active mdd-agent.service || true)" = inactive
          test "$(systemctl is-enabled mdd-agent.service || true)" = linked
          test ! -e /etc/systemd/system/multi-user.target.wants/mdd-agent.service
          agent_config_dir=/var/lib/mdd-agent
          sudo install -d -m 0700 "$agent_config_dir"
          sudo /usr/libexec/mdd/mdd-agent config init \
            -config "$agent_config_dir/config.json" >/dev/null
          sudo /usr/libexec/mdd/mdd-agent config set agent_id ci-linux-agent \
            -config "$agent_config_dir/config.json" >/dev/null
          sudo /usr/libexec/mdd/mdd-agent config set server localhost:8443 \
            -config "$agent_config_dir/config.json" >/dev/null
          sudo jq -r '.agent_token' /etc/mdd/auth.json |
            sudo /usr/libexec/mdd/mdd-agent config set token --stdin \
              -config "$agent_config_dir/config.json" >/dev/null
          cert_fingerprint=$(sudo openssl x509 -in /etc/mdd/tls/server.crt -outform DER |
            sha256sum | awk '{print $1}')
          sudo /usr/libexec/mdd/mdd-agent config set tls_sha256 "$cert_fingerprint" \
            -config "$agent_config_dir/config.json" >/dev/null
          test "$(sudo stat -c '%U:%G:%a' "$agent_config_dir/config.json")" = root:root:600
          sudo /usr/libexec/mdd/mdd-agent config show \
            -config "$agent_config_dir/config.json" | jq -e \
              '.ready == true and .settings.agent.modem_enabled == false and
               .settings.agent.server_token == "<redacted>"' >/dev/null
          test "$(sudo stat -c '%U:%G:%a' /etc/mdd)" = root:root:755
          for path in /etc/mdd/core.json /etc/mdd/auth.json \
              /etc/mdd/tls/server.crt /etc/mdd/tls/server.key; do
            test "$(sudo stat -c '%U:%G:%a' "$path")" = mdd:mdd:600
          done
          ci_ca_path="$RUNNER_TEMP/mdd-ci-ca.pem"
          sudo install -m 0644 /etc/mdd/tls/server.crt "$ci_ca_path"
          printf 'MDD_CI_CA_PATH=%s\n' "$ci_ca_path" >> "$GITHUB_ENV"
          sudo cat /var/lib/mdd-system/release-install/current.json |
            jq -e --arg release "$release_id" \
              '.state == "applied" and .release_id == $release' >/dev/null
          config_digest=$(sudo sha256sum /etc/mdd/core.json /etc/mdd/auth.json \
            /etc/mdd/tls/server.crt /etc/mdd/tls/server.key | sha256sum | awk '{print $1}')
          printf 'config_digest_before=%s\n' "$config_digest" >> "$GITHUB_ENV"
          sudo env "PATH=$shim_root:$PATH" "$RUNNER_TEMP/fresh/install-release.sh" start
          test ! -s "$legacy_trace"
          for attempt in $(seq 1 30); do
            if sudo env "PATH=$shim_root:$PATH" "$RUNNER_TEMP/fresh/install-release.sh" status; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          for unit in mdd-core.service mdd-provider-apply.service mdd-egress.service; do
            test "$(systemctl is-active "$unit")" = active
            test "$(systemctl show -p NRestarts --value "$unit")" = 0
          done
          sudo systemctl start mdd-agent.service
          for attempt in $(seq 1 30); do
            test "$(systemctl is-active mdd-agent.service)" = active && break
            test "$attempt" -lt 30
            sleep 1
          done
          test "$(systemctl show -p NRestarts --value mdd-agent.service)" = 0
          printf 'core_pid_before=%s\n' "$(systemctl show -p MainPID --value mdd-core.service)" >> "$GITHUB_ENV"
          printf 'agent_pid_before=%s\n' "$(systemctl show -p MainPID --value mdd-agent.service)" >> "$GITHUB_ENV"

      - name: Prove TLS login, authenticated WSS and zero paid state
        env:
          MDD_CI_PASSWORD: fresh-artifact-ci-password
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/login-request.json"
          response="$RUNNER_TEMP/login-response.json"
          cookie_jar="$RUNNER_TEMP/login-cookies"
          printf '{"username":"admin","password":"%s"}\n' "$MDD_CI_PASSWORD" > "$request"
          chmod 0600 "$request"
          curl --fail --silent --show-error \
            --cacert "$MDD_CI_CA_PATH" \
            --resolve localhost:8443:127.0.0.1 \
            -c "$cookie_jar" -H 'Content-Type: application/json' \
            --data-binary "@$request" \
            https://localhost:8443/api/auth/login > "$response"
          jq -e '.authenticated == true and (.csrf | length > 20)' "$response" >/dev/null
          cookie=$(sed 's/^#HttpOnly_//' "$cookie_jar" |
            awk -F '\t' '!/^#/ && NF >= 7 {print $6 "=" $7; exit}')
          test -n "$cookie"

          websocket_response="$RUNNER_TEMP/websocket-response"
          websocket_key=$(openssl rand -base64 16)
          set +e
          {
            printf 'GET /v1/browser/ws HTTP/1.1\r\n'
            printf 'Host: localhost:8443\r\n'
            printf 'Origin: https://localhost:8443\r\n'
            printf 'Upgrade: websocket\r\nConnection: Upgrade\r\n'
            printf 'Sec-WebSocket-Key: %s\r\n' "$websocket_key"
            printf 'Sec-WebSocket-Version: 13\r\n'
            printf 'Cookie: %s\r\n\r\n' "$cookie"
          } | timeout 5s openssl s_client \
              -connect 127.0.0.1:8443 -servername localhost \
              -CAfile "$MDD_CI_CA_PATH" -verify_return_error -quiet \
              > "$websocket_response" 2>&1
          websocket_status=$?
          set -e
          test "$websocket_status" -eq 0 || test "$websocket_status" -eq 124
          grep -Fq '101 Switching Protocols' "$websocket_response"

          common=(--fail --silent --show-error --cacert "$MDD_CI_CA_PATH" \
            --resolve localhost:8443:127.0.0.1 -b "$cookie_jar")
          curl "${common[@]}" https://localhost:8443/v1/lines |
            jq -e '.lines == []' >/dev/null
          curl "${common[@]}" 'https://localhost:8443/v1/calls?limit=100' |
            jq -e '.calls == []' >/dev/null
          curl "${common[@]}" https://localhost:8443/v1/messages |
            jq -e '.messages == []' >/dev/null
          for attempt in $(seq 1 30); do
            if curl "${common[@]}" https://localhost:8443/v1/agents |
                jq -e 'any(.agents[]; .agent_id == "ci-linux-agent" and
                  (.process_generation | length) > 0 and (.last_seen | length) > 0 and
                  .topology.reader_condition == "ready" and .topology.readers == [])' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          test -z "$(systemctl list-units 'mdd-vowifi@*.service' --state=running --no-legend --plain)"
          test ! -s "$legacy_trace"
          if test -x /usr/bin/docker; then
            test -z "$(sudo /usr/bin/docker ps -a --format '{{.Names}}' 2>/dev/null |
              grep -E '^mdd-sim-gateway-(control|engine)' || true)"
          fi

      - name: Prove reinstall is non-disruptive, then test explicit restart
        env:
          MDD_CI_PASSWORD: fresh-artifact-ci-password
        run: |
          set -euo pipefail
          sudo env "PATH=$shim_root:$PATH" \
            "$RUNNER_TEMP/fresh/install-release.sh" install "$release_dir"
          test "$(systemctl show -p MainPID --value mdd-core.service)" = "$core_pid_before"
          config_digest_after=$(sudo sha256sum /etc/mdd/core.json /etc/mdd/auth.json \
            /etc/mdd/tls/server.crt /etc/mdd/tls/server.key | sha256sum | awk '{print $1}')
          test "$config_digest_after" = "$config_digest_before"
          test ! -s "$legacy_trace"

          sudo env "PATH=$shim_root:$PATH" "$RUNNER_TEMP/fresh/install-release.sh" restart
          core_pid_after=$(systemctl show -p MainPID --value mdd-core.service)
          test "$core_pid_after" -gt 1
          test "$core_pid_after" != "$core_pid_before"
          test "$(systemctl show -p MainPID --value mdd-agent.service)" = "$agent_pid_before"
          test "$(systemctl show -p NRestarts --value mdd-agent.service)" = 0
          for attempt in $(seq 1 30); do
            if sudo env "PATH=$shim_root:$PATH" "$RUNNER_TEMP/fresh/install-release.sh" status; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          request="$RUNNER_TEMP/restart-login-request.json"
          response="$RUNNER_TEMP/restart-login-response.json"
          cookie_jar="$RUNNER_TEMP/restart-login-cookies"
          printf '{"username":"admin","password":"%s"}\n' "$MDD_CI_PASSWORD" > "$request"
          chmod 0600 "$request"
          curl --fail --silent --show-error \
            --cacert "$MDD_CI_CA_PATH" \
            --resolve localhost:8443:127.0.0.1 \
            -c "$cookie_jar" -H 'Content-Type: application/json' \
            --data-binary "@$request" \
            https://localhost:8443/api/auth/login > "$response"
          jq -e '.authenticated == true' "$response" >/dev/null
          common=(--fail --silent --show-error --cacert "$MDD_CI_CA_PATH" \
            --resolve localhost:8443:127.0.0.1 -b "$cookie_jar")
          for attempt in $(seq 1 30); do
            if curl "${common[@]}" https://localhost:8443/v1/agents |
                jq -e 'any(.agents[]; .agent_id == "ci-linux-agent" and
                  (.process_generation | length) > 0 and
                  .topology.reader_condition == "ready" and .topology.readers == [])' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30
            sleep 1
          done
          for unit in mdd-core.service mdd-provider-apply.service mdd-egress.service; do
            test "$(systemctl is-active "$unit")" = active
            test "$(systemctl show -p NRestarts --value "$unit")" = 0
          done
          test -z "$(systemctl list-units 'mdd-vowifi@*.service' --state=running --no-legend --plain)"
          test ! -s "$legacy_trace"

      - name: Stop fresh-host services
        if: always()
        run: |
          sudo systemctl disable --now \
            mdd-agent.service mdd-core.service mdd-provider-apply.service mdd-egress.service || true

  release-windows-amd64:
    name: Build Windows amd64 Agent
    needs:
      - validate-core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-runtime/go.mod
          cache-dependency-path: |
            agent/call-audio-helper/go.sum
            go-runtime/go.sum

      - name: Install Windows cross compiler
        run: |
          azure_cli_source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$azure_cli_source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$azure_cli_source"; then
            sudo mv "$azure_cli_source" "$azure_cli_source.disabled"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      - name: Build service, CLI and tray GUI package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MDD_SHARED_CACHE_ROOT: ${{ runner.temp }}/mdd-agent-cache
          TMPDIR: ${{ runner.temp }}/mdd-agent-build-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$MDD_SHARED_CACHE_ROOT"
          output="$RUNNER_TEMP/MDD-Agent-Windows-amd64"
          go-runtime/release/build-windows-agent.sh \
            --output "$output" \
            --version 0.1.0 \
            --build "$BUILD_NUMBER" \
            --arch amd64 \
            --cc x86_64-w64-mingw32-gcc
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/MDD-Agent-Windows-amd64.tar.gz" \
            MDD-Agent-Windows-amd64

      - name: Upload Windows Agent package
        uses: actions/upload-artifact@v7
        with:
          name: mdd-agent-windows-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/MDD-Agent-Windows-amd64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1

  release-macos-arm64:
    name: Build macOS arm64 Agent
    needs:
      - validate-core
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go-runtime/go.mod
          cache-dependency-path: |
            agent/call-audio-helper/go.sum
            go-runtime/go.sum

      - name: Test macOS modem and Agent boundaries
        env:
          TMPDIR: ${{ runner.temp }}/mdd-agent-test-tmp
          GOCACHE: ${{ runner.temp }}/mdd-agent-cache/go-build
          GOMODCACHE: ${{ runner.temp }}/mdd-agent-cache/go-mod
          GOTMPDIR: ${{ runner.temp }}/mdd-agent-test-tmp/go-tmp
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$TMPDIR" "$GOCACHE" "$GOMODCACHE" "$GOTMPDIR"
          go -C go-runtime test -race \
            ./internal/agentat \
            ./internal/cellulario \
            ./internal/darwinmodem \
            ./cmd/mdd-agent
          go -C go-runtime test -race -tags gui ./cmd/mdd-agent
          go -C go-runtime vet \
            ./internal/agentat \
            ./internal/cellulario \
            ./internal/darwinmodem \
            ./cmd/mdd-agent
          go -C go-runtime vet -tags gui ./cmd/mdd-agent

      - name: Build CLI, tray app and isolated modem helpers
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MDD_SHARED_CACHE_ROOT: ${{ runner.temp }}/mdd-agent-cache
          TMPDIR: ${{ runner.temp }}/mdd-agent-build-tmp
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR" "$MDD_SHARED_CACHE_ROOT"
          output="$RUNNER_TEMP/MDD-Agent-macOS-arm64"
          go-runtime/release/build-macos-agent.sh \
            --output "$output" \
            --version 0.1.0 \
            --build "$BUILD_NUMBER"
          test -x "$output/mdd-agent"
          test -x "$output/mdd-cellular-io"
          test -x "$output/mdd-call-audio-helper"
          test -s "$output/licenses/cellular-io-THIRD-PARTY.md"
          test -s "$output/licenses/libusb-LGPL-2.1.txt"
          test -s "$output/licenses/lwip-BSD-3-Clause.txt"
          test -x "$output/MDD Agent.app/Contents/MacOS/mdd-cellular-io"
          test -x "$output/MDD Agent.app/Contents/MacOS/mdd-call-audio-helper"
          plutil -extract NSMicrophoneUsageDescription raw \
            "$output/MDD Agent.app/Contents/Info.plist" >/dev/null
          app_executable_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
            "$output/MDD Agent.app/Contents/Info.plist")
          for executable in \
            "$output/mdd-agent" \
            "$output/mdd-call-audio-helper" \
            "$output/MDD Agent.app/Contents/MacOS/$app_executable_name" \
            "$output/MDD Agent.app/Contents/MacOS/mdd-call-audio-helper"; do
            codesign -d --entitlements :- "$executable" 2>/dev/null | \
              grep -Fq 'com.apple.security.device.audio-input'
          done
          for executable in \
            "$output/mdd-cellular-io" \
            "$output/MDD Agent.app/Contents/MacOS/mdd-cellular-io"; do
            if codesign -d --entitlements :- "$executable" 2>/dev/null | \
              grep -Fq 'com.apple.security.device.audio-input'; then
              echo 'cellular companion unexpectedly has microphone entitlement' >&2
              exit 1
            fi
          done
          otool -L "$output/mdd-cellular-io" | grep -Fq '/usr/lib/libSystem.B.dylib'
          if otool -L "$output/mdd-cellular-io" | grep -qi libusb; then
            echo 'mdd-cellular-io unexpectedly links dynamic libusb' >&2
            exit 1
          fi
          codesign --verify --strict "$output/mdd-agent"
          codesign --verify --deep --strict "$output/MDD Agent.app"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/MDD-Agent-macOS-arm64.tar.gz" \
            MDD-Agent-macOS-arm64

      - name: Upload macOS Agent package
        uses: actions/upload-artifact@v7
        with:
          name: mdd-agent-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/MDD-Agent-macOS-arm64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 1
