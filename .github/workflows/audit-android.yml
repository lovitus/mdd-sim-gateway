name: Prepare reviewed native Android draft
on:
  push:
    branches: [codex/audit-android-8fc2]
permissions:
  contents: read
jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 030567fbfe63917325d95dafcd7ddd1bb01f9912
          path: candidate
          persist-credentials: false
      - name: Apply reviewed native amendments for the full Android gates
        run: |
          set -euo pipefail
          python3 harness/audit/android/amend.py
          git -C candidate diff --cached --check
          test "$(git -C candidate diff --cached --name-only | wc -l)" -eq 8
      - name: Publish draft successor, not a test-passed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate commit -m 'fix: native resource IDs, private backup policy and exact enrollment ownership' -m 'Extend emulator tests for authenticated reconnection, revocation and unchanged reader keepalive. Native build/lint/device gates must still pass before APK release.'
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C candidate -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/android-v2-amend
