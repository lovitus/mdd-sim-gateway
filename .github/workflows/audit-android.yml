name: Clarify Android distribution dependency scope
on:
  push:
    branches: [codex/audit-android-8fc2]
permissions:
  contents: read
jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Distinguish test-only notices without changing the released APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=android-preview-c639dd2b7700
          mkdir distribution
          gh release download "$tag" -D distribution
          (cd distribution && sha256sum --check DISTRIBUTION-SHA256SUMS)
          echo '6fe4209ac18dbdf24168eac2b7c1601cc70c10b5b33581b7adf80ae22fce94bd  distribution/mdd-agent-preview.apk' | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          p=Path('distribution/THIRD_PARTY_NOTICES.md')
          old='The APK includes the following runtime dependency families. See runtime-dependencies.txt for the exact Gradle-resolved graph:'
          new='The Android source distribution references the following dependency families across application and test code. Only the application dependencies listed in runtime-dependencies.txt are on the release runtime classpath; AndroidX testing libraries are not shipped in the release APK:'
          s=p.read_text()
          assert old in s
          p.write_text(s.replace(old,new))
          PY
          rm distribution/mdd-android-preview-distribution.tar.gz
          (cd distribution && sha256sum LICENSE APACHE-2.0.txt THIRD_PARTY_NOTICES.md REPOSITORY_NOTICE REPOSITORY_THIRD_PARTY_LICENSES.md publicsuffix-NOTICE runtime-dependencies.txt android-agent-source.tar.gz mdd-agent-preview.apk > DISTRIBUTION-SHA256SUMS)
          tar -czf mdd-android-preview-distribution.tar.gz -C distribution .
          gh release upload "$tag" --clobber distribution/THIRD_PARTY_NOTICES.md distribution/DISTRIBUTION-SHA256SUMS mdd-android-preview-distribution.tar.gz
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-preview-distribution-final
          path: |
            distribution/
            mdd-android-preview-distribution.tar.gz
          retention-days: 14
