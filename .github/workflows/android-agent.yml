name: Android native agent preview
on:
  push:
    branches: [codex/android-v2]
    tags: ['android-preview-v*']
  pull_request:
    branches: [main, codex/android-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MDD_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Compile, lint and unit-test native app
        run: gradle -p android-agent --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Sign non-debuggable test APK and verify it
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-preview-v')) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/codex/android-v2') ||
          (github.event_name == 'workflow_dispatch' &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/android-v2' ||
          github.ref == 'refs/heads/codex/android-client-focused' ||
          github.ref == 'refs/heads/codex/android-production-adaptation' ||
          github.ref == 'refs/heads/codex/android-status-messages-ux' ||
          github.ref == 'refs/heads/codex/android-sim-readback' ||
          github.ref == 'refs/heads/codex/android-usb-access-recovery' ||
          github.ref == 'refs/heads/codex/android-dial-prefix'))
        shell: bash
        env:
          PREVIEW_KEYSTORE: ${{ secrets.MDD_ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          MDD_ANDROID_STORE_PASSWORD: ${{ secrets.MDD_ANDROID_PREVIEW_STORE_PASSWORD }}
          MDD_ANDROID_KEY_PASSWORD: ${{ secrets.MDD_ANDROID_PREVIEW_STORE_PASSWORD }}
          MDD_ANDROID_KEY_ALIAS: mdd-preview
          MDD_ANDROID_STORE_TYPE: PKCS12
        run: |
          set -euo pipefail
          umask 077
          mkdir -p android-evidence
          test -n "$PREVIEW_KEYSTORE" && test -n "$MDD_ANDROID_STORE_PASSWORD"
          export MDD_ANDROID_KEYSTORE="$RUNNER_TEMP/android-preview.p12"
          trap 'rm -f "$MDD_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > "$MDD_ANDROID_KEYSTORE"
          unset PREVIEW_KEYSTORE
          gradle -p android-agent --no-daemon assembleRelease
          cp android-agent/app/build/outputs/apk/release/app-release.apk android-evidence/mdd-agent-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-evidence/mdd-agent-preview.apk > android-evidence/signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 8b5e818fccfa6f6738cd53658b2df9ab57a014f9a5269decc4104d91894dd5e2' android-evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-evidence/mdd-agent-preview.apk > android-evidence/package.txt
          if grep -q application-debuggable android-evidence/package.txt; then
            echo '::error::Refusing a debuggable release APK'; exit 1
          fi
          grep -Fq "package: name='com.lovitus.mddagent.preview' versionCode='$MDD_ANDROID_VERSION_CODE' versionName='$(cat VERSION)-preview'" android-evidence/package.txt
          (cd android-evidence && sha256sum mdd-agent-preview.apk > SHA256SUMS)
          git rev-parse HEAD HEAD^{tree} > android-evidence/source.txt
          cp android-agent/README.md android-evidence/README.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-preview-build
          path: |
            android-evidence/
            android-agent/app/build/reports/
            android-agent/app/build/test-results/
            android-agent/app/build/outputs/apk/
          retention-days: 14
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: KVM permission for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v7
        with:
          name: android-preview-build
          path: release-bundle
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            gradle -p android-agent --no-daemon connectedDebugAndroidTest
            mkdir -p android-screens
            if [[ "$GITHUB_REF" == refs/tags/android-preview-v* ]]; then test -s release-bundle/android-evidence/mdd-agent-preview.apk; fi
            if [ -f release-bundle/android-evidence/mdd-agent-preview.apk ]; then adb -P 5037 -s emulator-5554 install -r release-bundle/android-evidence/mdd-agent-preview.apk; adb -P 5037 -s emulator-5554 shell am start -W -n com.lovitus.mddagent.preview/com.lovitus.mddagent.MainActivity; adb -P 5037 -s emulator-5554 exec-out screencap -p > android-screens/setup.png; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-emulator-${{ matrix.api }}
          path: |
            android-screens/
            android-agent/app/build/outputs/connected_android_test_additional_output/
            android-agent/app/build/reports/androidTests/
            android-agent/app/build/outputs/androidTest-results/
          retention-days: 14
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-runtime/go.mod
          cache-dependency-path: go-runtime/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Native dependencies
        run: |
          source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$source"; then sudo mv "$source" "$source.disabled"; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcsclite-dev libopencore-amrnb-dev libasound2-dev pkg-config
      - name: Mobile state and existing Agent boundaries
        run: |
          set -o pipefail
          go -C go-runtime test -json -race -count=1 -timeout 3m ./internal/core ./agentlink | tee android-core.jsonl
          go -C go-runtime vet ./internal/core ./agentlink
          node tools/repository-check.mjs
          node tools/repository-check.test.mjs
      - name: Existing incoming call identity and embedded UI
        working-directory: webui
        run: |
          npm ci
          npm run test:all
          MDD_KEEP_EMBED_SOURCE=1 npm run build:go
          git diff --exit-code -- ../go-runtime/internal/webui/assets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-core-contracts
          path: android-core.jsonl
          retention-days: 14
  preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-preview-v')
    needs: [build, device, core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mdd-public-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: android-preview-build
          path: ${{ runner.temp }}/release-assets/android
      - name: Publish the tested tag with the stable preview identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ROOT: ${{ runner.temp }}/release-assets
        shell: bash
        run: |
          set -euo pipefail
          node tools/publish-release.mjs android
