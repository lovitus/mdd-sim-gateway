name: Android native agent preview
on:
  push:
    branches: [codex/android-v2]
  pull_request:
    branches: [main, codex/android-v2]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MDD_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile, lint and unit-test native app
        run: gradle -p android-agent --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Sign non-debuggable test APK and verify it
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PREVIEW_KEYSTORE: ${{ secrets.MDD_ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          MDD_ANDROID_STORE_PASSWORD: ${{ secrets.MDD_ANDROID_PREVIEW_STORE_PASSWORD }}
          MDD_ANDROID_KEY_PASSWORD: ${{ secrets.MDD_ANDROID_PREVIEW_STORE_PASSWORD }}
          MDD_ANDROID_KEY_ALIAS: mdd-preview
          MDD_ANDROID_STORE_TYPE: PKCS12
        run: |
          set -euo pipefail
          umask 077
          mkdir -p android-evidence
          test -n "$PREVIEW_KEYSTORE" && test -n "$MDD_ANDROID_STORE_PASSWORD"
          export MDD_ANDROID_KEYSTORE="$RUNNER_TEMP/android-preview.p12"
          trap 'rm -f "$MDD_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$PREVIEW_KEYSTORE" | base64 --decode > "$MDD_ANDROID_KEYSTORE"
          unset PREVIEW_KEYSTORE
          gradle -p android-agent --no-daemon assembleRelease
          cp android-agent/app/build/outputs/apk/release/app-release.apk android-evidence/mdd-agent-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-evidence/mdd-agent-preview.apk > android-evidence/signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: 8b5e818fccfa6f6738cd53658b2df9ab57a014f9a5269decc4104d91894dd5e2' android-evidence/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android-evidence/mdd-agent-preview.apk > android-evidence/package.txt
          ! grep -q application-debuggable android-evidence/package.txt
          (cd android-evidence && sha256sum mdd-agent-preview.apk > SHA256SUMS)
          git rev-parse HEAD HEAD^{tree} > android-evidence/source.txt
          cp android-agent/README.md android-evidence/README.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-preview-build
          path: |
            android-evidence/
            android-agent/app/build/reports/
            android-agent/app/build/test-results/
            android-agent/app/build/outputs/apk/
          retention-days: 14
  device:
    needs: [build, core]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Structured UI XML reader
        run: |
          source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$source"; then sudo mv "$source" "$source.disabled"; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
      - name: KVM permission for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v7
        with:
          name: android-preview-build
          path: release-bundle
      - uses: actions/download-artifact@v7
        with:
          name: android-process-fixture
          path: process-fixture
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android-agent/scripts/verify-emulator.sh 5037 emulator-5554
        env:
          MDD_SKIP_PREVIEW_INSTALL: ${{ github.event_name == 'pull_request' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-emulator-${{ matrix.api }}
          path: |
            android-screens/
            android-process-evidence/
            android-agent/app/build/reports/androidTests/
            android-agent/app/build/outputs/androidTest-results/
          retention-days: 14
  recovery-control:
    needs: [build, core]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: XML and disposable emulator support
        run: |
          source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$source"; then sudo mv "$source" "$source.disabled"; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v7
        with:
          name: android-preview-build
          path: release-bundle
      - uses: actions/download-artifact@v7
        with:
          name: android-process-fixture
          path: process-fixture
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android-agent/scripts/verify-emulator.sh 5037 emulator-5554 control
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-control-${{ matrix.api }}
          path: android-control-evidence/
          retention-days: 14
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-runtime/go.mod
          cache-dependency-path: go-runtime/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Native dependencies
        run: |
          source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$source"; then sudo mv "$source" "$source.disabled"; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcsclite-dev libopencore-amrnb-dev libasound2-dev pkg-config
      - name: Mobile state and existing Agent boundaries
        run: |
          set -o pipefail
          go -C go-runtime test -json -race -count=1 -timeout 5m ./internal/core ./agentlink ./internal/agentcall ./internal/agenthost ./internal/callhistory ./internal/cellularmedia ./mediaauth ./providercontrol ./providermessages ./vowifiipc ./tools/android-process-fixture | tee android-core.jsonl
          go -C go-runtime vet ./internal/core ./agentlink ./internal/agentcall ./internal/cellularmedia ./providercontrol ./providermessages
          node tools/repository-check.mjs
          node tools/repository-check.test.mjs
      - name: Build isolated hardware-validation Core for the desktop host
        env:
          CGO_ENABLED: '0'
          GOOS: darwin
          GOARCH: arm64
        run: |
          mkdir -p "$RUNNER_TEMP/android-hardware-core"
          go -C go-runtime build -trimpath -o "$RUNNER_TEMP/android-hardware-core/mdd-core" ./cmd/mdd-core
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/android-hardware-core/source.txt"
          (cd "$RUNNER_TEMP/android-hardware-core" && sha256sum mdd-core > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: android-hardware-core-darwin-arm64
          path: ${{ runner.temp }}/android-hardware-core/
          retention-days: 14
      - name: Build external QA peers (not release components)
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/android-process-fixture"
          GOOS=linux GOARCH=amd64 go -C go-runtime build -trimpath -o "$RUNNER_TEMP/android-process-fixture/fixture-linux-amd64" ./tools/android-process-fixture
          GOOS=darwin GOARCH=arm64 go -C go-runtime build -trimpath -o "$RUNNER_TEMP/android-process-fixture/fixture-darwin-arm64" ./tools/android-process-fixture
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/android-process-fixture/source.txt"
          (cd "$RUNNER_TEMP/android-process-fixture" && sha256sum fixture-* > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: android-process-fixture
          path: ${{ runner.temp }}/android-process-fixture/
          retention-days: 14
      - name: Existing incoming call identity and embedded UI
        working-directory: webui
        run: |
          npm ci
          npm run test:all
          MDD_KEEP_EMBED_SOURCE=1 npm run build:go
          git diff --exit-code -- ../go-runtime/internal/webui/assets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-core-contracts
          path: android-core.jsonl
          retention-days: 14
  provider-recovery:
    name: Race-test Android call recovery Provider boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: providers/vowifi-go/go.mod
          cache-dependency-path: |
            go-runtime/go.sum
            providers/vowifi-go/go.sum
            providers/vowifi-go/upstream/vowifi-go/go.sum
            agent/call-audio-helper/go.sum
      - name: Install Provider test dependencies
        run: |
          azure_cli_source=/etc/apt/sources.list.d/azure-cli.sources
          if [[ -f "$azure_cli_source" ]] && grep -Fq 'packages.microsoft.com/repos/azure-cli' "$azure_cli_source"; then
            sudo mv "$azure_cli_source" "$azure_cli_source.disabled"
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libopencore-amrnb-dev pkg-config
      - name: Verify Provider modules
        run: |
          go -C providers/vowifi-go mod verify
          GOWORK=off go -C providers/vowifi-go/upstream/vowifi-go mod verify
      - name: Race-test Provider recovery and patched voicehost
        run: |
          set -o pipefail
          go -C providers/vowifi-go test -json -race -count=1 -timeout 5m ./... 2>&1 | tee android-provider.jsonl
          GOWORK=off go -C providers/vowifi-go/upstream/vowifi-go test -json -race -count=1 -timeout 5m ./runtimehost/voicehost/... 2>&1 | tee android-voicehost.jsonl
      - name: Vet Provider recovery and patched voicehost
        run: |
          go -C providers/vowifi-go vet ./...
          GOWORK=off go -C providers/vowifi-go/upstream/vowifi-go vet ./runtimehost/voicehost/...
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-provider-contracts
          path: |
            android-provider.jsonl
            android-voicehost.jsonl
          retention-days: 14
  preview:
    if: github.ref == 'refs/heads/codex/android-v2'
    needs: [build, device, recovery-control, core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-preview-build
          path: bundle
      - name: Publish only the tested head as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api 'repos/${{ github.repository }}/git/ref/heads/codex/android-v2' --jq .object.sha)" = "$GITHUB_SHA"
          cd bundle/android-evidence
          sha256sum --check SHA256SUMS
          cat > release-notes.md <<'NOTES'
          Native Android Agent preview — draft PR implementation, not a production rollout.

          Android 9+; native setup, server calls/SMS, USB APDU-level CCID slot-0 / access-controlled OMAPI reader sharing, bounded network recovery and foreground availability.
          Requires the matching Core /v1/mobile/ws implementation in the draft PR. No production server is automatically updated.
          The normal preview APK is non-debuggable and uses the repository's stable preview signing identity. Do not uninstall a differently signed existing app or reuse the QA package for normal use.
          API 28/35 emulators, unit tests and Core protocol tests gate this prerelease. Synthetic audio is not a real SIM/carrier or screen-off/OEM/battery acceptance.
          No paid calls/SMS or physical SIM operations were performed. See README and signature/checksum evidence.
          NOTES
          gh release create "android-preview-${GITHUB_SHA:0:12}" mdd-agent-preview.apk SHA256SUMS signature.txt package.txt source.txt README.md --target "$GITHUB_SHA" --prerelease --title "Android Agent 0.1 preview ${GITHUB_SHA:0:7}" --notes-file release-notes.md
