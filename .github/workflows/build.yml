name: CI Tests & Multi-Arch Build Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. Automated Test Suites (Python, Go, Android & Docker)
  # ============================================================================
  test-python:
    name: Run Python Test Suite (480+ Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies (PCSC & Tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swig libpcsclite-dev libpcsclite1 pcscd

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r control/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest -v tests/

  test-go-agent:
    name: Run Go Card Agent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install libpcsclite-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcsclite-dev pkg-config

      - name: Run Go Unit Tests
        working-directory: agent/go-agent
        run: |
          go test -v -race ./...

  test-android:
    name: Run Android Agent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        working-directory: agent/android
        run: |
          gradle testDebugUnitTest

  test-docker-smoke:
    name: Docker Container Image Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Control Image
        run: |
          docker build -t mdd-control-test:latest -f control/Dockerfile .

      - name: Start Test Container
        run: |
          docker run -d --name mdd-smoke-test \
            --network host \
            -e HTTP_PORT=8000 \
            -e HTTPS_PORT=8443 \
            mdd-control-test:latest
          
          # Wait up to 30 seconds for health check
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/mdd/api/version | grep -q "version"; then
              echo "Container is healthy!"
              break
            fi
            echo "Waiting for container startup ($i/30)..."
            sleep 1
          done

      - name: Probe Endpoints
        run: |
          echo "Testing HTTP endpoint..."
          curl -fail -s http://127.0.0.1:8000/mdd/api/version
          echo ""
          curl -fail -s http://127.0.0.1:8000/mdd/ | head -n 10
          echo ""
          echo "Testing HTTPS endpoint (self-signed TLS)..."
          curl -fail -k -s https://127.0.0.1:8443/mdd/api/version

      - name: Cleanup Test Container
        if: always()
        run: |
          docker logs mdd-smoke-test || true
          docker rm -f mdd-smoke-test || true

  # ============================================================================
  # 2. Multi-Platform Client & Image Build Jobs (Only on Tags or Manual Dispatch)
  # ============================================================================
  build-agents:
    name: Build Go Card Agents
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: mdd-card-agent-linux-amd64
          - os: linux
            arch: arm64
            output: mdd-card-agent-linux-arm64
          - os: linux
            arch: arm
            arm_ver: 7
            output: mdd-card-agent-linux-armv7
          - os: windows
            arch: amd64
            output: mdd-card-agent-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Cross Compilers & Headers (Linux/Windows)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf pkg-config libpcsclite-dev
          
          # Setup ARM sysroots for PCSC
          sudo dpkg --add-architecture arm64
          sudo dpkg --add-architecture armhf
          sudo apt-get update -qq || true
          
          mkdir -p /tmp/arm64-pkg && cd /tmp/arm64-pkg
          apt-get download libpcsclite1:arm64 libpcsclite-dev:arm64 || true
          sudo mkdir -p /sysroot-arm64
          for deb in *.deb; do [ -f "$deb" ] && sudo dpkg-deb -x "$deb" /sysroot-arm64; done
          
          mkdir -p /tmp/armhf-pkg && cd /tmp/armhf-pkg
          apt-get download libpcsclite1:armhf libpcsclite-dev:armhf || true
          sudo mkdir -p /sysroot-armhf
          for deb in *.deb; do [ -f "$deb" ] && sudo dpkg-deb -x "$deb" /sysroot-armhf; done

      - name: Build Binary
        working-directory: agent/go-agent
        run: |
          if [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "amd64" ]; then
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ${{ matrix.output }} main.go
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            PKG_CONFIG_PATH=/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig \
            PKG_CONFIG_SYSROOT_DIR=/sysroot-arm64 \
            CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -ldflags="-s -w" -o ${{ matrix.output }} main.go
          elif [ "${{ matrix.os }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm" ]; then
            PKG_CONFIG_PATH=/sysroot-armhf/usr/lib/arm-linux-gnueabihf/pkgconfig \
            PKG_CONFIG_SYSROOT_DIR=/sysroot-armhf \
            CGO_ENABLED=1 GOOS=linux GOARCH=arm GOARM=${{ matrix.arm_ver }} CC=arm-linux-gnueabihf-gcc \
            go build -ldflags="-s -w" -o ${{ matrix.output }} main.go
          elif [ "${{ matrix.os }}" = "windows" ]; then
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc \
            go build -ldflags="-s -w" -o ${{ matrix.output }} main.go
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: agent/go-agent/${{ matrix.output }}

  build-darwin-agents:
    name: Build macOS Go Card Agents
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS ARM64 & AMD64 Binaries
        working-directory: agent/go-agent
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o mdd-card-agent-darwin-arm64 main.go
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o mdd-card-agent-darwin-amd64 main.go

      - name: Upload Darwin ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdd-card-agent-darwin-arm64
          path: agent/go-agent/mdd-card-agent-darwin-arm64

      - name: Upload Darwin AMD64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdd-card-agent-darwin-amd64
          path: agent/go-agent/mdd-card-agent-darwin-amd64

  build-android-agent:
    name: Build Android Card Agent APK
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: agent/android
        run: |
          gradle assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdd-card-agent.apk
          path: agent/android/app/build/outputs/apk/debug/app-debug.apk

  build-docker-control:
    name: Build Control Image (AMD64 & ARM64)
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Control Plane Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./control/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mdd-sim-gateway-control:latest
            ghcr.io/${{ github.repository_owner }}/mdd-sim-gateway-control:${{ github.ref_name }}
