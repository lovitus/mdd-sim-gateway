name: Legacy Python/Docker manual build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the explicitly named legacy release and container images
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing/new v-prefixed GitHub release tag (required when publish is true)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Automated Test Suites (Python, Go, Android & Docker Smoke)
  # ============================================================================
  test-python:
    name: Run Python Test Suite (480+ Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'control/requirements.txt'

      - name: Install System Dependencies (PCSC & Tools)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swig libpcsclite-dev libpcsclite1 pcscd

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r control/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=. pytest -v tests/

  test-go-agent:
    name: Run Go Card Agent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: 'agent/go-agent/go.sum'

      - name: Install libpcsclite-dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcsclite-dev pkg-config

      - name: Run Go Unit Tests
        working-directory: agent/go-agent
        run: |
          go test -v -race ./...

  test-android:
    name: Run Android Agent Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Run Android Unit Tests
        working-directory: agent/android
        run: |
          gradle testDebugUnitTest

  test-docker-smoke:
    name: Docker Container Image Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Control Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./control/Dockerfile
          load: true
          tags: mdd-control-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Test Container
        run: |
          docker run -d --name mdd-smoke-test \
            --network host \
            -e HTTP_PORT=8000 \
            -e HTTPS_PORT=8443 \
            mdd-control-test:latest
          
          # Wait up to 30 seconds for health check
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/mdd/api/auth/status | grep -q "status"; then
              echo "Container is healthy!"
              break
            fi
            echo "Waiting for container startup ($i/30)..."
            sleep 1
          done

      - name: Probe Endpoints
        run: |
          set -euo pipefail
          echo "Testing HTTP endpoint..."
          curl -fail -s http://127.0.0.1:8000/mdd/api/auth/status
          echo ""
          curl -fail -s http://127.0.0.1:8000/mdd/ | head -n 10
          echo ""
          echo "Testing HTTPS endpoint with the exact generated trust anchor..."
          cert="$RUNNER_TEMP/mdd-legacy-smoke.crt"
          docker cp mdd-smoke-test:/var/lib/mdd/config/certs/self-signed.crt "$cert"
          chmod 0600 "$cert"
          openssl verify -CAfile "$cert" "$cert"
          curl --fail --silent --show-error \
            --cacert "$cert" --resolve localhost:8443:127.0.0.1 \
            https://localhost:8443/mdd/api/auth/status

      - name: Cleanup Test Container
        if: always()
        run: |
          docker logs mdd-smoke-test || true
          docker rm -f mdd-smoke-test || true

  # ============================================================================
  # 2. Multi-Platform legacy client/image jobs (manual dispatch only)
  # ============================================================================
  build-agents:
    name: Build Go Card Agents
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            output: mdd-card-agent-linux-amd64
          - os: linux
            arch: arm64
            output: mdd-card-agent-linux-arm64
          - os: linux
            arch: arm
            arm_ver: 7
            output: mdd-card-agent-linux-armv7
          - os: windows
            arch: amd64
            output: mdd-card-agent-windows-amd64.exe
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: 'agent/go-agent/go.sum'

      - name: Build Binary
        working-directory: agent/go-agent
        run: |
          chmod +x build_cross.sh
          ./build_cross.sh "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.output }}" "${{ matrix.arm_ver || 7 }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: agent/go-agent/${{ matrix.output }}
          retention-days: 1

  build-darwin-agents:
    name: Build macOS Go Card Agents
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: 'agent/go-agent/go.sum'

      - name: Build macOS ARM64 & AMD64 Binaries
        working-directory: agent/go-agent
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o mdd-card-agent-darwin-arm64 main.go
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o mdd-card-agent-darwin-amd64 main.go

      - name: Upload Darwin ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdd-card-agent-darwin-arm64
          path: agent/go-agent/mdd-card-agent-darwin-arm64
          retention-days: 1

      - name: Upload Darwin AMD64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdd-card-agent-darwin-amd64
          path: agent/go-agent/mdd-card-agent-darwin-amd64
          retention-days: 1

  build-android-agent:
    name: Build Android Card Agent APK
    needs: [test-python, test-go-agent, test-android, test-docker-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        working-directory: agent/android
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mdd-card-agent.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdd-card-agent.apk
          path: agent/android/app/build/outputs/apk/debug/mdd-card-agent.apk
          retention-days: 1

  validate-release-target:
    name: Validate explicit release target
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.target.outputs.release_tag }}
      tag_exists: ${{ steps.target.outputs.tag_exists }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4

      - name: Require the tag to be new or point at this commit
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          [[ "$TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]{0,126}$ ]] || {
            echo 'publish requires a valid v-prefixed release_tag (maximum 128 characters)' >&2
            exit 2
          }
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null
          remote_status=$?
          set -e
          case "$remote_status" in
            0)
              git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
              target=$(git rev-parse "$TAG^{commit}")
              test "$target" = "$GITHUB_SHA" || {
                echo "release tag $TAG points at $target, not workflow commit $GITHUB_SHA" >&2
                exit 2
              }
              tag_exists=true
              ;;
            2) tag_exists=false ;;
            *) echo 'failed to query the release tag from origin' >&2; exit 2 ;;
          esac
          printf 'release_tag=%s\ntag_exists=%s\n' "$TAG" "$tag_exists" >> "$GITHUB_OUTPUT"

  publish-release-assets:
    name: Publish All Release Binaries to Release
    needs: [build-agents, build-darwin-agents, build-android-agent, validate-release-target]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-release-target.outputs.release_tag }}
      RELEASE_TAG_EXISTS: ${{ needs.validate-release-target.outputs.tag_exists }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-artifacts

      - name: Upload Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ "$RELEASE_TAG_EXISTS" == false ]]; then
            gh release create "$TAG" --target "$GITHUB_SHA" \
              --title "MDD VoWiFi Gateway $TAG" --generate-notes
          elif ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MDD VoWiFi Gateway $TAG" --generate-notes
          fi
          git fetch --force --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA"
          find /tmp/all-artifacts -type f -exec gh release upload "$TAG" {} --clobber \;

  publish-docker-control:
    name: Publish legacy Control image (AMD64 & ARM64)
    needs: [publish-release-assets, validate-release-target]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.validate-release-target.outputs.release_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reconfirm release tag is this workflow commit
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Control Plane Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./control/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mdd-sim-gateway-control:latest
            ghcr.io/${{ github.repository_owner }}/mdd-sim-gateway-control:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
