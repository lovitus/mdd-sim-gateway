name: Prepare exact PR10 resumed amendments
on:
  push:
    branches: [codex/audit-pr8-fixes]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 67e90b079932bdd91c573b65da5b226ee7fd6332
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply incremental changes without replacing the existing repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cat harness/audit/pr8/resumed.b64 | base64 -d | xz -d > "$RUNNER_TEMP/amend.patch"
          echo "a680dbf1fbf33717d5f89f5f5d45400061c1cb8058bea71151609bce4ed2d7bc  $RUNNER_TEMP/amend.patch" | sha256sum --check
          git -C candidate apply --unidiff-zero --check "$RUNNER_TEMP/amend.patch"
          git -C candidate apply --unidiff-zero "$RUNNER_TEMP/amend.patch"
          git -C candidate add -u
          test "$(git -C candidate diff --cached --name-only | wc -l)" -eq 10
          test "$(git -C candidate write-tree)" = 919a7d046e158f2a4ef9554ef483ce2d5d4b2174
          git -C candidate diff --cached --check
          node candidate/tools/repository-check.mjs | tee evidence/repository.log
          node candidate/tools/repository-check.test.mjs | tee evidence/repository-tests.log
      - name: Publish successor for full Android and Go gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate diff --cached --name-only > evidence/files.txt
          git -C candidate diff --cached --binary > evidence/amend.patch
          git -C candidate commit -m 'fix: fence storage reset callbacks and retain unresolved message records' -m 'Preserve the existing PR10 repair. Add controlled reset/read/write interleavings, upstream negative control and rejection-refresh coverage. Require actual encoder progress in browser tests. Full Android/Go validation is a separate gate; no merge or deployment.'
          git -C candidate rev-parse HEAD HEAD^{tree} > evidence/source.txt
          git -C candidate archive --format=tar.gz HEAD > evidence/source.tar.gz
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C candidate -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/review-pr8-resumed-candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr10-resumed-candidate
          path: evidence/
          retention-days: 7
