name: Publish exact second-pass PR8 repair
on:
  push:
    branches: [codex/pr8-repair-source]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: da701361c4b35562f51ee9f9457bdfba6233208a
          path: candidate
          persist-credentials: false
      - name: Verify second-pass patch and candidate tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          base64 --decode harness/audit/pr8-repair/followup.b64 | xz --decompress > "$RUNNER_TEMP/followup.patch"
          echo "d83d069d313c069a4109fb62b2b0adb118c4f0adcb5078e1860b197b51b99cfa  $RUNNER_TEMP/followup.patch" | sha256sum --check
          git -C candidate apply --check "$RUNNER_TEMP/followup.patch"
          git -C candidate apply "$RUNNER_TEMP/followup.patch"
          git -C candidate add -A
          test "$(git -C candidate write-tree)" = be56fb7e78063a80b509212d362ca3c3368cdcaa
          git -C candidate diff --cached --check
          cp "$RUNNER_TEMP/followup.patch" evidence/
      - name: Publish exact successor for full CI gates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate commit -m 'fix: preserve confirmed rejection and staged recovery boundaries' -m 'A final rejection plus a transport error cannot redial during registration refresh. Explicit reset also respects a readable staged unresolved record. Add defensive tests without relaxing authorization, unknown-outcome or storage gates.'
          git -C candidate rev-parse HEAD HEAD^{tree} > evidence/source.txt
          git -C candidate ls-files -s > evidence/manifest.txt
          git -C candidate archive --format=tar.gz HEAD > evidence/source.tar.gz
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C candidate -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/pr8-fix-amend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr8-repair-second-pass
          path: evidence/
          retention-days: 14
