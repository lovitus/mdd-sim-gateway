name: Snapshot exact PR8 repair baseline
on:
  push:
    branches: [codex/pr8-repair-source]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ffb469798c047ba0bc2b7aa41b30348030b32801
          persist-credentials: false
      - name: Preserve exact source and manifest for isolated repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr8-source"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/pr8-source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr8-source/source.txt"
          git ls-files -s > "$RUNNER_TEMP/pr8-source/manifest.txt"
          (cd "$RUNNER_TEMP/pr8-source" && sha256sum source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: pr8-exact-repair-baseline
          path: ${{ runner.temp }}/pr8-source/
          retention-days: 7
