name: Validate remaining-work implementation before publication
on:
  push:
    branches: ['codex/audit-open-work-08de1fb']
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ba8befe649684f95661459fa8889933de9a4bf73
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply and test explicit recording retry after browser suspension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C candidate apply "$GITHUB_WORKSPACE/harness/audit/open-work/retry-fix.patch"
          git -C candidate add webui/src/callRecording.js webui/tests/callRecording.mjs webui/tests/recordingBrowser.mjs
          test "$(git -C candidate write-tree)" = 9858facd098c045adb592c926f8e6603eb17e5b4
          node candidate/tools/repository-check.mjs | tee evidence/ledger.log
          node candidate/tools/repository-check.test.mjs | tee evidence/ledger-tests.log
          cd candidate/webui
          npm ci
          npm run test:all | tee ../../evidence/webui.log
          for repeat in 1 2 3; do npm run test:recording-browser 2>&1 | tee "../../evidence/browser-$repeat.log"; done
          MDD_KEEP_EMBED_SOURCE=1 npm run build:go | tee ../../evidence/build.log
      - name: Publish only tested recorder fix and rebuilt app asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C candidate add -A go-runtime/internal/webui/assets
          git -C candidate diff --cached --check
          git -C candidate diff --cached --name-only > evidence/files.txt
          test "$(wc -l < evidence/files.txt)" -eq 4
          git -C candidate diff --cached --binary > evidence/tested-retry.patch
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate commit -m 'fix: release failed recording admission and allow explicit audio-resume retry'
          git -C candidate rev-parse HEAD HEAD^{tree} > evidence/source.txt
          git -C candidate ls-files -s > evidence/source-manifest.txt
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C candidate -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/review-open-work-candidate
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: open-work-recording-retry-proof
          path: evidence/
          retention-days: 7
