name: Validate remaining-work implementation before publication
on:
  push:
    branches: ['codex/audit-open-work-08de1fb']
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: a8c2a9d73f102e72daafcc99ec224186f5205a6d
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reconcile mixed voice criterion without claiming hardware acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git -C candidate apply "$GITHUB_WORKSPACE/harness/audit/open-work/ledger-fix.patch"
          node candidate/tools/repository-check.mjs --write | tee evidence/ledger.log
          node candidate/tools/repository-check.test.mjs | tee evidence/ledger-tests.log
          node candidate/webui/tests/callRecording.mjs | tee evidence/recording-tests.log
          git -C candidate add TODO.md docs/status/README.md docs/status/acceptance.json
          git -C candidate diff --cached --check
          test "$(git -C candidate diff --cached --name-only | wc -l)" -eq 3
          test "$(git -C candidate write-tree)" = cd578c541e837830918cfa04b1450b7f7f53192d
          git -C candidate diff --cached > evidence/tested-ledger.patch
      - name: Publish tested ledger-only successor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C candidate config user.name 'github-actions[bot]'
          git -C candidate config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C candidate commit -m 'docs: reconcile implemented recording with retained field acceptance evidence'
          git -C candidate rev-parse HEAD HEAD^{tree} > evidence/source.txt
          authorization=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C candidate -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/review-open-work-ledger
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: open-work-ledger-proof
          path: evidence/
          retention-days: 7
