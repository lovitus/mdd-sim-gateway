plugins { id 'com.android.application' }
android {
    namespace 'com.lovitus.mddagent'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lovitus.mddagent.preview'
        minSdk 28
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('MDD_ANDROID_VERSION_CODE') ?: '1')
        versionName '0.1.0-preview'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs { preview {
        storeFile file(System.getenv('MDD_ANDROID_KEYSTORE') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
        storePassword System.getenv('MDD_ANDROID_STORE_PASSWORD') ?: 'android'
        keyAlias System.getenv('MDD_ANDROID_KEY_ALIAS') ?: 'androiddebugkey'
        keyPassword System.getenv('MDD_ANDROID_KEY_PASSWORD') ?: 'android'
    } }
    buildTypes { release { minifyEnabled false; debuggable false; signingConfig signingConfigs.preview } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true; animationsDisabled = true }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
